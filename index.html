<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 80vh;
            max-height: 700px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            margin-bottom: 8px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 70%;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .user {
            justify-content: flex-end;
        }

        .user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 18px 18px 4px 18px;
        }

        .assistant {
            justify-content: flex-start;
        }

        .assistant .message-content {
            background: #e9ecef;
            color: #333;
            border-radius: 18px 18px 18px 4px;
        }

        .error {
            justify-content: flex-start;
        }

        .error .message-content {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 18px 18px 18px 4px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #e9ecef;
            border-radius: 18px;
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.5;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-10px);
            }
        }

        .input-area {
            border-top: 1px solid #e0e0e0;
            padding: 16px;
            display: flex;
            gap: 12px;
            background: white;
            border-radius: 0 0 12px 12px;
        }

        #prompt {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 24px;
            padding: 12px 16px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        #prompt:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #999;
            text-align: center;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-state-text {
            font-size: 16px;
            font-weight: 500;
        }

        #chat::-webkit-scrollbar {
            width: 8px;
        }

        #chat::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        #chat::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 10px;
        }

        #chat::-webkit-scrollbar-thumb:hover {
            background: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI MEDICAL ASSITANT</h1>
            <p>Powered by Llama 3.2 - Running Locally</p>
        </div>

        <div id="chat">
            <div class="empty-state">
                <div class="empty-state-icon">💬</div>
                <div class="empty-state-text">Start a conversation</div>
            </div>
        </div>

        <div class="input-area">
            <input
                type="text"
                id="prompt"
                placeholder="Ask me anything..."
                onkeypress="if(event.key==='Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"
            >
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatDiv = document.getElementById('chat');
        const promptInput = document.getElementById('prompt');
        const sendBtn = document.getElementById('sendBtn');
        let isLoading = false;

        function clearEmptyState() {
            if (chatDiv.querySelector('.empty-state')) {
                chatDiv.innerHTML = '';
            }
        }

        function addMessage(text, isUser, isError = false) {
            clearEmptyState();

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';

            const contentDiv = document.createElement('div');
            contentDiv.className = `message-content ${isError ? 'error' : (isUser ? 'user' : 'assistant')}`;
            contentDiv.textContent = text;

            messageDiv.appendChild(contentDiv);
            chatDiv.appendChild(messageDiv);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        function showTypingIndicator() {
            clearEmptyState();

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.id = 'typing-indicator';

            const indicatorDiv = document.createElement('div');
            indicatorDiv.className = 'typing-indicator';

            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('div');
                dot.className = 'typing-dot';
                indicatorDiv.appendChild(dot);
            }

            messageDiv.appendChild(indicatorDiv);
            chatDiv.appendChild(messageDiv);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) {
                indicator.remove();
            }
        }

        async function sendMessage() {
            const message = promptInput.value.trim();

            if (!message || isLoading) return;

            isLoading = true;
            sendBtn.disabled = true;
            promptInput.disabled = true;

            addMessage(message, true);
            promptInput.value = '';

            showTypingIndicator();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: message,
                        session_id: 'default',
                        generation_params: {
                            max_tokens: 350
                        }
                    })
                });

                if (!response.ok) {
                    let errorMessage = 'Failed to get response';
                    try {
                        const errorData = await response.json();
                        errorMessage = errorData.details || errorData.error || errorMessage;
                    } catch (e) {
                        const text = await response.text();
                        errorMessage = text || `HTTP ${response.status}`;
                    }
                    throw new Error(errorMessage);
                }

                const data = await response.json();

                removeTypingIndicator();

                if (data.crisis) {
                    addMessage(data.response, false, true);
                } else {
                    addMessage(data.response, false);
                }

            } catch (error) {
                console.error('Error:', error);
                removeTypingIndicator();
                addMessage(`❌ Error: ${error.message}`, false, true);
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                promptInput.disabled = false;
                promptInput.focus();
            }
        }

        promptInput.focus();
    </script>
</body>
</html>
